<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chemist Clash</title>
  <style>
    html, body { margin: 0; height: 100%; background: #060a13; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; outline: none; }
    #notice {
      display: none; max-width: 34rem; padding: 2rem; color: #dbe6f7;
      font: 16px/1.6 "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    }
    #notice code { background: #18233a; padding: 0.15em 0.45em; border-radius: 4px; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="notice">
    <h1>Chemist Clash</h1>
    <p>Browsers will not load the game's scripts straight from a file. Start the bundled server instead:</p>
    <p><code>npm start</code></p>
    <p>then open <code>http://localhost:5173</code>.</p>
  </div>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('game').style.display = 'none';
      document.getElementById('notice').style.display = 'block';
    }
  </script>
  <!-- bump ?v= when shipping so GitHub Pages clients skip stale module cache -->
  <script type="module" src="src/main.js?v=20261119b"></script>
</body>
</html>
